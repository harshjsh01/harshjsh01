<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Dark Cybernetic Canvas Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#060e24" />
      <stop offset="80%" stop-color="#041226" />
      <stop offset="100%" stop-color="#02050e" />
    </linearGradient>

    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#00ff87" />
    </linearGradient>

    <linearGradient id="electricBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00ff87" stop-opacity="1" />
      <stop offset="75%" stop-color="#00b4d8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f5d4" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1" fill="#00f5d4" fill-opacity="0.25" />
    </pattern>

    <pattern id="dotGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>

    <style>
      @keyframes gridPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.8; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(6px) rotate(-4deg); }
      }
      @keyframes wavePulse {
        0% { transform: scale(0.85); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 0.2; }
        100% { transform: scale(0.85); opacity: 0.8; }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3; opacity: 0.6; }
        50% { r: 4.5; opacity: 1; filter: drop-shadow(0 0 4px #00ff87); }
      }
      @keyframes scanline {
        0% { transform: translateY(-250px); }
        100% { transform: translateY(250px); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes subTitleFade {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 1px #00f5d4); }
        50% { opacity: 1; filter: drop-shadow(0 0 5px #00ff87); }
      }
      @keyframes radarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin3D {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.05); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes particleFloat1 {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(15px, -20px); opacity: 0.9; }
      }
      @keyframes particleFloat2 {
        0%, 100% { transform: translate(0, 0); opacity: 0.4; }
        50% { transform: translate(-18px, -15px); opacity: 0.85; }
      }

      .tech-title {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
        font-weight: 800;
        letter-spacing: 4.5px;
      }
      .tech-subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: 2px;
      }
      .mono-tag {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
      .grid-layer { animation: gridPulse 6s ease-in-out infinite; }
      .float-group-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .float-group-2 { animation: floatReverse 8s ease-in-out infinite; transform-origin: center; }
      .pulse-node { animation: nodePulse 3s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 8, 12; animation: dataFlow 2.5s linear infinite; }
      .data-stream-rev { stroke-dasharray: 6, 10; animation: dataFlow 3s linear infinite reverse; }
      .subtitle-glow { animation: subTitleFade 4s ease-in-out infinite; }
      .cursor { animation: cursorBlink 0.9s infinite; }
      .particle-1 { animation: particleFloat1 5s ease-in-out infinite; }
      .particle-2 { animation: particleFloat2 6.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="850" height="250" fill="url(#bgGrad)" rx="14" />

  <!-- Cyber Grid Background -->
  <rect width="850" height="250" fill="url(#cyberGrid)" class="grid-layer" rx="14" />
  <rect width="850" height="250" fill="url(#dotGrid)" rx="14" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="50" r="140" fill="#00f5d4" fill-opacity="0.04" filter="url(#glowCyan)" />
  <circle cx="750" cy="180" r="150" fill="#00ff87" fill-opacity="0.03" filter="url(#glowGreen)" />
  <circle cx="425" cy="125" r="180" fill="#0284c7" fill-opacity="0.04" />

  <!-- ==================== LEFT GRAPHIC: 5G WAVES & WIREFRAME MECHANICAL MOTIF ==================== -->
  <g class="float-group-1" transform="translate(90, 125)">
    <!-- 5G Propagating Wave Rings -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00f5d4" stroke-width="0.75" stroke-dasharray="3, 5" stroke-opacity="0.25">
      <animate attributeName="r" values="60;80;60" dur="5s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00ff87" stroke-width="0.8" stroke-dasharray="4, 4" stroke-opacity="0.3">
      <animate attributeName="r" values="45;65;45" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

    <!-- 5G Wave Arcs -->
    <path d="M -40 -30 A 50 50 0 0 1 -40 30" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M -52 -42 A 67 67 0 0 1 -52 42" fill="none" stroke="#00ff87" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2s" begin="0.4s" repeatCount="indefinite" />
    </path>
    <path d="M -64 -54 A 84 84 0 0 1 -64 54" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.3">
      <animate attributeName="opacity" values="0.05;0.6;0.05" dur="2s" begin="0.8s" repeatCount="indefinite" />
    </path>

    <!-- Rotating Wireframe 3D Octahedron / Core Node -->
    <g transform="scale(0.85)">
      <polygon points="0,-42 36,-10 0,22 -36,-10" fill="#00f5d4" fill-opacity="0.04" stroke="url(#wireframeGrad)" stroke-width="1.2">
        <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="24s" repeatCount="indefinite" />
      </polygon>
      <polygon points="0,42 36,10 0,-22 -36,10" fill="#00ff87" fill-opacity="0.03" stroke="url(#cyanGreenGrad)" stroke-width="1">
        <animateTransform attributeName="transform" type="rotate" values="360; 0" dur="28s" repeatCount="indefinite" />
      </polygon>
      <!-- Central 5G Data Core -->
      <circle cx="0" cy="0" r="6" fill="#00f5d4" filter="url(#glowCyan)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- Mechanical Dev Steno Keycap Isometric Wireframe -->
    <g transform="translate(15, 38) scale(0.65)">
      <path d="M -20 -10 L 0 -20 L 20 -10 L 20 10 L 0 20 L -20 10 Z" fill="#060e24" fill-opacity="0.7" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.7" />
      <path d="M -14 -6 L 0 -13 L 14 -6 L 14 6 L 0 13 L -14 6 Z" fill="none" stroke="#00ff87" stroke-width="0.8" stroke-opacity="0.5" />
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
      <line x1="-14" y1="-6" x2="14" y2="6" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.4" />
    </g>

    <!-- Small Floating Tech Glyph -->
    <text x="-6" y="-55" fill="#00f5d4" font-size="8" class="mono-tag" opacity="0.65">5G-RF</text>
  </g>

  <!-- ==================== RIGHT GRAPHIC: NEURAL NETWORK CONSTELLATION ==================== -->
  <g class="float-group-2" transform="translate(745, 125)">
    <!-- Neural Synapse Connections -->
    <line x1="-50" y1="-45" x2="-15" y2="-10" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.4" class="data-stream" />
    <line x1="-15" y1="-10" x2="35" y2="-35" stroke="#00ff87" stroke-width="1.2" stroke-opacity="0.5" class="data-stream-rev" />
    <line x1="-15" y1="-10" x2="10" y2="40" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" class="data-stream" />
    <line x1="-50" y1="30" x2="-15" y2="-10" stroke="#00f5d4" stroke-width="0.9" stroke-opacity="0.35" />
    <line x1="35" y1="-35" x2="48" y2="25" stroke="#00ff87" stroke-width="1.1" stroke-opacity="0.4" class="data-stream" />
    <line x1="10" y1="40" x2="48" y2="25" stroke="#00f5d4" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="-50" y1="-45" x2="-50" y2="30" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="2, 3" />

    <!-- Neural Network Nodes (Pulsing) -->
    <!-- Input Layer -->
    <circle cx="-50" cy="-45" r="3.5" fill="#00f5d4" filter="url(#subtleGlow)" class="pulse-node" />
    <circle cx="-50" cy="30" r="3" fill="#38bdf8" filter="url(#subtleGlow)" />
    <!-- Hidden / Central Hub -->
    <circle cx="-15" cy="-10" r="5.5" fill="#00ff87" filter="url(#glowGreen)" />
    <circle cx="-15" cy="-10" r="2.5" fill="#ffffff" />
    <!-- Output Layer -->
    <circle cx="35" cy="-35" r="4" fill="#00f5d4" filter="url(#subtleGlow)" class="pulse-node" />
    <circle cx="10" cy="40" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="48" cy="25" r="4.5" fill="#00ff87" filter="url(#glowCyan)" />

    <!-- Rotating Deep Learning Orbit -->
    <ellipse cx="0" cy="0" rx="65" ry="28" fill="none" stroke="#00f5d4" stroke-width="0.75" stroke-dasharray="4, 6" stroke-opacity="0.3" transform="rotate(-25)">
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="20s" repeatCount="indefinite" />
    </ellipse>

    <text x="-22" y="62" fill="#00ff87" font-size="7.5" class="mono-tag" opacity="0.7">[NEURAL-MESH]</text>
  </g>

  <!-- ==================== FLOATING PARTICLES ==================== -->
  <g>
    <circle cx="210" cy="55" r="1.5" fill="#00f5d4" class="particle-1" />
    <circle cx="630" cy="45" r="1.2" fill="#00ff87" class="particle-2" />
    <circle cx="250" cy="190" r="1.8" fill="#38bdf8" class="particle-2" />
    <circle cx="610" cy="195" r="1.4" fill="#00f5d4" class="particle-1" />
    <circle cx="425" cy="35" r="1.5" fill="#00ff87" class="particle-1" />
  </g>

  <!-- ==================== HUD FRAME & ACCENTS ==================== -->
  <!-- Top Left Corner Bracket -->
  <path d="M 24 45 L 24 24 L 45 24" fill="none" stroke="#00f5d4" stroke-width="2" stroke-linecap="square" filter="url(#subtleGlow)" />
  <circle cx="24" cy="24" r="2" fill="#00ff87" />

  <!-- Top Right Corner Bracket -->
  <path d="M 826 45 L 826 24 L 805 24" fill="none" stroke="#00f5d4" stroke-width="2" stroke-linecap="square" filter="url(#subtleGlow)" />
  <circle cx="826" cy="24" r="2" fill="#00ff87" />

  <!-- Bottom Left Corner Bracket -->
  <path d="M 24 205 L 24 226 L 45 226" fill="none" stroke="#00f5d4" stroke-width="2" stroke-linecap="square" filter="url(#subtleGlow)" />
  <circle cx="24" cy="226" r="2" fill="#00ff87" />

  <!-- Bottom Right Corner Bracket -->
  <path d="M 826 205 L 826 226 L 805 226" fill="none" stroke="#00f5d4" stroke-width="2" stroke-linecap="square" filter="url(#subtleGlow)" />
  <circle cx="826" cy="226" r="2" fill="#00ff87" />

  <!-- Top Center System Status Tag -->
  <g transform="translate(425, 34)">
    <rect x="-145" y="-12" width="290" height="20" rx="10" fill="#060e24" stroke="#00f5d4" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="-125" cy="-2" r="3" fill="#00ff87" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="-112" y="1" fill="#00f5d4" font-size="8.5" class="mono-tag" opacity="0.9">SYSTEM ONLINE // ZENFINE LABS ARCHITECT</text>
  </g>

  <!-- ==================== CENTER HERO CONTENT ==================== -->
  <!-- Glowing Divider Line (Above Name) -->
  <line x1="280" y1="52" x2="570" y2="52" stroke="url(#glowLineGrad)" stroke-width="1.5" filter="url(#subtleGlow)" />

  <!-- Main Heading: HARSH JOSHI -->
  <!-- Layer 1: Glow / Blur Copy -->
  <text x="425" y="112" text-anchor="middle" fill="#00f5d4" font-size="44" class="tech-title" filter="url(#glowCyan)" opacity="0.5">
    HARSH JOSHI
  </text>
  <!-- Layer 2: Sharp Crisp Gradient Text -->
  <text x="425" y="112" text-anchor="middle" fill="url(#cyanGreenGrad)" font-size="44" class="tech-title" filter="url(#subtleGlow)">
    HARSH JOSHI
  </text>
  
  <!-- Terminal Prompt Symbol & Blinking Cursor -->
  <g transform="translate(425, 112)">
    <rect x="185" y="-36" width="4" height="38" fill="#00ff87" class="cursor" filter="url(#glowGreen)" />
  </g>

  <!-- Subtitle: Creative AI Engineer & Deep-Tech Founder -->
  <text x="425" y="152" text-anchor="middle" fill="#e2e8f0" font-size="14.5" class="tech-subtitle subtitle-glow">
    Creative AI Engineer &amp; Deep-Tech Founder
  </text>

  <!-- Cyber Sub-bar / Skill Tags Matrix -->
  <g transform="translate(425, 186)">
    <!-- Pill 1: 5G HARDWARE -->
    <rect x="-240" y="-10" width="105" height="20" rx="4" fill="#060e24" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.5" />
    <text x="-187.5" y="3" text-anchor="middle" fill="#00f5d4" font-size="8.5" class="mono-tag">⚡ 5G HARDWARE</text>

    <!-- Pill 2: ENTERPRISE AI -->
    <rect x="-125" y="-10" width="115" height="20" rx="4" fill="#060e24" stroke="#00ff87" stroke-width="0.75" stroke-opacity="0.5" />
    <text x="-67.5" y="3" text-anchor="middle" fill="#00ff87" font-size="8.5" class="mono-tag">🧠 ENTERPRISE AI</text>

    <!-- Pill 3: IIT ROPAR RESEARCH -->
    <rect x="0" y="-10" width="125" height="20" rx="4" fill="#060e24" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5" />
    <text x="62.5" y="3" text-anchor="middle" fill="#38bdf8" font-size="8.5" class="mono-tag">🔬 IIT ROPAR RES.</text>

    <!-- Pill 4: WEBAR & 3D -->
    <rect x="135" y="-10" width="105" height="20" rx="4" fill="#060e24" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.5" />
    <text x="187.5" y="3" text-anchor="middle" fill="#00f5d4" font-size="8.5" class="mono-tag">🌐 WEBAR / 3D</text>
  </g>

  <!-- Glowing Divider Line (Bottom Matrix) -->
  <line x1="240" y1="214" x2="610" y2="214" stroke="url(#glowLineGrad)" stroke-width="1.2" />

  <!-- Mini Bottom Metrics -->
  <text x="425" y="232" text-anchor="middle" fill="#64748b" font-size="8" class="mono-tag">
    LATENCY: 0.12ms  |  QUANTUM-READY ARCHITECTURE  |  GEC BIKANER CSE '27
  </text>
</svg>
